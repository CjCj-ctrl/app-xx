<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เมฑา แพรเถื่อน</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans Thai", Tahoma, sans-serif;
      background: #f4f8f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }

    .first-name {
      color: #087f72;
    }

    .last-name {
      color: #d34e35;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.4rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="first-name">เมฑา</span> <span class="last-name">แพรเถื่อน</span></h1>
  </main>
</body>
</html>
